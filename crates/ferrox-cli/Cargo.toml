[package]
name = "ferrox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "llama.cpp-style CLI for the Ferrox inference engine"
readme = "README.md"
keywords = ["llm", "inference", "cli", "gguf", "ferrox"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "ferrox"
path = "src/main.rs"

[dependencies]
ferrox-gguf = { workspace = true }
ferrox-quant = { workspace = true }
ferrox-cuda = { workspace = true }
ferrox-metal = { workspace = true }
half = { workspace = true }
ferrox-core = { workspace = true }
ferrox-models = { workspace = true, features = ["hub"] }
ferrox-safetensors = { workspace = true }
# Optional, and off by default -- see the `serve` feature below.
ferrox-server = { workspace = true, optional = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
byteorder = { workspace = true }
# For the SIGINT handler in `ferrox chat`: Ctrl-C stops the turn rather
# than the session. No new external dependency -- ferrox-core already
# uses it.
libc = { workspace = true }

[features]
default = ["serve"]
# Must forward to ferrox-models the same way `metal` does, or the CLI
# links a ferrox-core built *without* `cuda` -- no `cuda_dense_enabled`,
# no `apply_gpu` CUDA arm -- and `cargo build -p ferrox-cli --features
# cuda` does not compile at all. Only ever caught on a real CUDA host,
# because CI has none.
cuda = ["ferrox-cuda/cuda", "ferrox-models/cuda", "ferrox-server?/cuda"]
# Caps detection + Metal apply_gpu dispatch through ferrox-models.
metal = ["ferrox-metal/metal", "ferrox-models/metal", "ferrox-server?/metal"]
# `ferrox serve`: the OpenAI-compatible HTTP server, linked in from the
# ferrox-server library rather than reimplemented, so both front ends
# share one `ServerArgs` and one code path.
#
# ON BY DEFAULT. `cargo install ferrox-cli` gives you the whole tool:
# completions, `ferrox serve`, `ferrox download`, bench, verify. One
# binary that does everything is worth more than a small one that does
# part of it and makes you discover a feature flag to get the rest.
#
# It costs build time and crates (axum, tokio, hyper, rustls), and that
# is the trade. A library consumer who wants only the model code should
# depend on ferrox-models or ferrox-core directly rather than on the
# CLI, or pass `default-features = false`.
#
# The `?` in the cuda/metal features above still matters: they forward
# to ferrox-server only if it is in the graph, never enable it.
serve = ["dep:ferrox-server"]
