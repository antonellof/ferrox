[package]
name = "frink-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Apple Metal kernels for the Frink inference engine"
readme = "README.md"
keywords = ["metal", "gpu", "llm", "apple", "frink"]
categories = ["hardware-support", "science"]

[dependencies]
thiserror = { workspace = true }
# Used by the Metal weight cache to keep `BytesNoCopy` mmap aliases
# alive for the lifetime of the resident MTLBuffer (see `gpu.rs`).
memmap2 = { workspace = true }
# f16 Metal KV (matches llama.cpp default -ctk/-ctv f16).
half = { workspace = true }
# Host-side Q8_0 pack/unpack for `FRINK_CTK=q8_0` upload/download.
frink-quant = { workspace = true }

# Metal bindings are Apple-platform-only; kept as a target-specific
# optional dependency so `cargo build -p frink-metal` (no features)
# still succeeds on Linux/Windows CI, and `--features metal` only ever
# attempts to pull objc2-metal in when actually targeting macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
# `block2` feature enables `newBufferWithBytesNoCopy:...:deallocator:`,
# which lets resident weight buffers alias the mmap/owned bytes in place
# instead of uploading a second copy (see `resident_weight_buffer`).
objc2-metal = { version = "0.3.2", optional = true, features = ["block2"] }

[dev-dependencies]
frink-quant = { workspace = true }
half = { workspace = true }

[features]
default = []
# Real Metal compute dispatch on Apple Silicon, using objc2-metal's
# bindings to the system Metal framework (no separate SDK/toolchain
# needed beyond Xcode command line tools, which ship the framework).
# Building with this feature on a non-macOS target fails to compile
# (objc2-metal doesn't target other platforms) -- this mirrors the
# `cuda` feature's Linux/Windows/NVIDIA-only scope in reverse.
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
